[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chai-club"
version = "0.1.0"
description = "A community platform for chai lovers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["services/matching-service/tests"]
pythonpath = ["services/matching-service"]
