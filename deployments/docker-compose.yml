version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: chai-postgres
    environment:
      POSTGRES_USER: chai_user
      POSTGRES_PASSWORD: chai_password
      POSTGRES_DB: chai_club_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: